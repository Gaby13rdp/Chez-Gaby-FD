# ============================================================================
#  CATALOGUE DES ÉQUIPEMENTS
#  Dans un logement, on liste les CLÉS (à gauche), ex. :
#      equipements: [wifi, cuisine-equipee, lave-linge]
#  Vous pouvez ajouter vos propres équipements à la fin de ce fichier.
#   • icone : nom d'icône Lucide (https://lucide.dev/icons)
#   • categorie : essentiels | cuisine | chambre | salle-de-bain | loisirs |
#                 exterieur | famille | securite | services | travail
#   • fr / en / id : libellés en français, anglais, indonésien
#   • filtre : true = proposé dans les filtres de recherche
# ============================================================================

