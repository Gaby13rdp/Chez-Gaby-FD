# ════════════════════════════════════════════════════════════════════════════
#  PHOTOS À IMPORTER — lu par le workflow « Importer les photos » (docs/03)
#
#  Organisation : une adresse (dossier de content/etablissements), puis :
#    photos:     photos de l'adresse (façade, parties communes)
#    logements:  pour chaque logement (dossier de content/logements), ses photos
#  Pour chaque photo, 3 lignes :
#    - url:      adresse de la photo sur Booking ou Airbnb
#      fichier:  nom du fichier à créer (01 = photo de couverture)
#      legende:  légende en français (ajoutée à photos.yml si elle n'y est pas)
#
#  • Relancer le workflow est sans risque : une photo déjà présente n'est
#    jamais re-téléchargée. Ajoutez simplement les lignes d'un nouveau
#    logement ou d'une nouvelle adresse, puis relancez.
#  • Ligne désactivée = « # » en début de ligne (sur ses 3 lignes).
#  • Pour retirer une photo importée : supprimez le fichier ET ses 3 lignes.
#  • La taille maximale est prise automatiquement (Airbnb : originale ;
#    Booking : la plus grande proposée).
# ════════════════════════════════════════════════════════════════════════════
