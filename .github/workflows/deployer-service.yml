# ─────────────────────────────────────────────────────────────────────────────
# DÉPLOYER LE SERVICE CLOUDFLARE (facultatif)
# Paiement en ligne (niveau 2), formulaire « worker », disponibilités en direct.
# À lancer à la main : Actions > « Déployer le service Cloudflare » > Run workflow.
# Prérequis (docs/07) : secrets GitHub CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID.
# Les clés du service (Stripe, Resend, Google…) se règlent dans Cloudflare,
# JAMAIS dans GitHub : voir paiement-worker/README.md.
# ─────────────────────────────────────────────────────────────────────────────
name: Déployer le service Cloudflare

on:
  workflow_dispatch:
    inputs:
      adresse_site:
        description: "Adresse publique du site (vide = « url » de config/site.yml, sinon l'adresse GitHub Pages)"
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploiement-service
  cancel-in-progress: false

jobs:
  deployer:
    name: Tester et déployer le service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: paiement-worker/package-lock.json

      - name: Vérifier les secrets Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Secrets Cloudflare manquants::Ajoutez CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans Settings > Secrets and variables > Actions (docs/07-paiement-option.md)."
            exit 1
          fi

      - name: Déterminer l'adresse du site
        id: site
        env:
          ADRESSE: ${{ inputs.adresse_site }}
          PROPRIETAIRE: ${{ github.repository_owner }}
          DEPOT: ${{ github.event.repository.name }}
        run: |
          adresse="$ADRESSE"
          if [ -z "$adresse" ]; then
            adresse=$(grep -E '^url:' config/site.yml | sed -E 's/^url:[[:space:]]*//; s/[[:space:]]*(#.*)?$//; s/"//g')
          fi
          if [ -z "$adresse" ]; then
            proprio=$(echo "$PROPRIETAIRE" | tr '[:upper:]' '[:lower:]')
            if [ "$DEPOT" = "$proprio.github.io" ]; then adresse="https://$proprio.github.io"; else adresse="https://$proprio.github.io/$DEPOT"; fi
          fi
          adresse="${adresse%/}"
          case "$adresse" in
            https://*|http://*) ;;
            *) echo "::error::Adresse du site invalide : « $adresse »"; exit 1 ;;
          esac
          echo "url=$adresse" >> "$GITHUB_OUTPUT"
          echo "Adresse du site reliée au service : $adresse"

      - name: Tests automatiques du service
        run: node --test paiement-worker/tests/*.test.mjs

      - name: Installer l'outil de déploiement (Wrangler)
        working-directory: paiement-worker
        run: npm ci --no-audit --no-fund

      - name: Déployer sur Cloudflare
        working-directory: paiement-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADRESSE_SITE: ${{ steps.site.outputs.url }}
        # --keep-vars : les réglages saisis dans le tableau de bord Cloudflare sont conservés.
        run: npx wrangler deploy --keep-vars --var "SITE_URL:${ADRESSE_SITE}"

      - name: Résumé
        run: |
          {
            echo "### Service déployé"
            echo "Ouvrez l'adresse en **workers.dev** affichée dans l'étape « Déployer sur Cloudflare » : la page indique ce qui est configuré."
            echo "Copiez cette adresse dans config/site.yml (paiement.worker_url, formulaire.worker_url, calendrier.temps_reel.url) selon les fonctions utilisées."
          } >> "$GITHUB_STEP_SUMMARY"
