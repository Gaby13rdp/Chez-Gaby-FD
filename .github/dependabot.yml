# Mises à jour automatiques et groupées des dépendances (proposées sous forme
# de « pull requests » à accepter ; le contrôle qualité les vérifie d'abord).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dependances:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /paiement-worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
